# Feature Engineering Settings
feature_engineering:
  # Temporal features
  temporal:
    cyclic_encoding: True # Hour of day, day of week, etc. as sin/cos
    rolling_windows: [1, 3, 6, 12, 24, 48, 96, 168] # Hours: 1h, 3h, 6h, 12h, 1d,..., 1w
    lag_features: [1, 2, 3, 6, 12, 24, 48, 96, 168, 336] # Hours back
    fourier_terms: 6 # Number of Fourier terms for seasonal decomposition
    holiday_flags: True # Include holiday indicators
    time_encoding: "sincos" # Options: "sincos", "onehot", "embedding"
    
  # Spatial features
  spatial:
    neighbor_lags: [1, 2, 3] # Consider N-hop neighbors
    distance_decay: "exponential" # Options: "linear", "exponential", "inverse"
    decay_alpha: 0.5 # ← base value
    tune_decay_alpha: True # set False to keep fixed
    spatial_embedding_dim: 16 # Dimension for location embeddings
    use_graph_convolution: True # Use graph-based features
    adjacency_type: "distance"  # Options: "distance", "flow", "combined"
    include_zone_clusters: True # Cluster zones by demand patterns
    num_zone_clusters: 8 # Number of zone clusters
    
  # Advanced features
  advanced:
    price_elasticity_estimation: True # Estimate price sensitivity
    driver_supply_features: True # Include driver availability
    passenger_behavior_segments: True # Segment passengers
    contextual_embeddings: True # Embedding-based features
    autoencoder_dimension: 32 # For embedding generation
    trip_velocity_features: True # Speed/flow features
    use_weather: True # If weather data is available
    advanced_weather_features: True # Advanced weather features
    trip_interaction_graph: True # Model trip interactions between zones
    
  # Feature selection
  feature_selection:
    method: "shap_then_boruta" # Options: "permutation", "shap", "boruta", "rfe"
    top_n_features: 100 # Number of features to keep

# Data Processing
processing:
  target_variable: "trip_count" # Target to predict
  aggregation_interval: "1H" # Pandas resample frequency
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  validation_method: "time_series_split" # Options: "time_series_split", "expanding_window", "purged_kfold"
  gap: 24 # Gap between train and validation
  n_splits: 5 # For cross validation
  min_trips_per_zone: 20 # Filter out zones with too few trips
  outlier_treatment: "winsorize" # Options: "clip", "winsorize", "remove", "none"
  winsorize_limits: [0.01, 0.99] # Percentiles for winsorization

# Models Configuration
models:
  # LightGBM Configuration
  lightgbm:
    enabled: True
    params:
      random_state: 42
      bagging_seed: 42
      feature_fraction_seed: 42
      data_random_seed: 42
      objective: "regression"
      metric: "mae"
      boosting_type: "gbdt"
      num_leaves: 12000
      max_bin: 512
      feature_fraction: 0.9
      learning_rate: 0.0001
      n_estimators: 10000
      colsample_bytree: 0.9
      subsample: 0.9
      reg_alpha: 0.1
      reg_lambda: 0.1
      max_depth: 16 # keep unlimited in baseline
      bagging_freq: 5 # enables row-sampling
    hyperopt:
      enabled: True
      n_trials: 100
      timeout: 72000 # seconds
      cv: 5
      early_stopping_rounds: 100
      params_space:
        max_depth: [4,6,8,12]
        num_leaves: 65536
        learning_rate: "loguniform(1e-3, 0.1)"
        n_estimators: [100, 300, 500, 1000]
        subsample: [0.6, 0.8, 1.0]
        colsample_bytree: [0.6, 0.8, 1.0]
        reg_alpha: [0, 0.1, 0.5, 1.0]
        reg_lambda: [0, 0.1, 0.5, 1.0]

  # Temporal Fusion Transformer
  tft:
    enabled: True
    params:
      random_state: 42
      hidden_size: 8 #128
      lstm_layers: 2
      dropout: 0.1
      attention_heads: 2
      learning_rate: 0.001
      batch_size: 128
      max_epochs: 2 #50
      early_stopping_patience: 5
      gradient_clip_val: 0.1
      hidden_continuous_size: 4
      variable_selection_method: "gated"  # "learned" or "gated" or "embed"
      learning_rate_decay: 0.5
      lr_decay_patience: 3
      optimizer: "ranger" # often converges faster on TFT
    static_variables: ["zone_cluster", "is_residential", "is_business", "zone_area"]
    time_varying_known_categoricals: ["hour", "day_of_week", "month", "is_holiday"]
    time_varying_known_reals: ["driver_count", "weather_temp", "weather_prcp", "special_events"]
    time_varying_unknown_reals: ["trip_count", "trip_distance_mean", "surge_multiplier_mean"]
    hyperopt:
      enabled: True
      n_trials: 30
      timeout: 14400 # seconds
      params_space:
        hidden_size: [16, 32, 64, 128]
        lstm_layers: [1, 2, 3]
        dropout: [0.1, 0.2, 0.3]
        attention_heads: [1, 2, 4, 8]
        learning_rate: [0.0001, 0.001, 0.01]
        hidden_continuous_size: [16, 32, 64, 128]

  # Spatio-Temporal Graph Neural Network
  stgcn:
    enabled: True
    params:
      random_state: 42
      hidden_channels: 64
      spatial_kernel_size: 3
      temporal_kernel_size: 3
      num_nodes: "${autofill}"
      num_features: "${autofill}"
      dilation: 2
      residual: True
      num_timesteps_input: 12  # Look back 12 hours
      num_timesteps_output: 1  # Predict next hour
      batch_size: 32
      learning_rate: 0.001
      epochs: 50
      patience: 5
      optimizer: "adam"
    hyperopt:
      enabled: True
      n_trials: 30
      timeout: 14400 # seconds
      params_space:
        dilation: [1,2]
        hidden_channels: [32, 64, 128]
        spatial_kernel_size: [2, 3, 4]
        temporal_kernel_size: [2, 3, 4]
        learning_rate: [0.0001, 0.001, 0.01]
        num_timesteps_input: [6, 12, 24]

  # Meta-Learner Ensemble
  ensemble:
    enabled: True
    params:
      random_state: 42
      stacking_cv_strategy: "purged_kfold"
      models_to_ensemble: ["lightgbm", "tft", "stgcn"]
      meta_learner: "ridge" # Options: "ridge", "lasso", "elasticnet", "lightgbm"
      use_oof_predictions: True # Use out-of-fold predictions for training
      stacking_cv: 5 # Number of CV folds for stacking

# Uncertainty Quantification
uncertainty:
  enabled: True
  method: "cqr" # Options: "conformal", "quantile", "bootstrap", "mve"
  calibration_ratio: 0.2
  prediction_intervals: [0.5, 0.9, 0.95] # Confidence levels
  ensemble_uncertainty: True # Combine uncertainties from multiple models
  recalibration: True # Recalibrate prediction intervals

# Evaluation Metrics
evaluation:
  metrics: ["mae", "mse", "rmse", "mape", "r2"]
  additional_metrics: ["smape", "wmape", "coverage", "sharpness"]
  aggregation_levels:
    - ["start_location_id"]  # By location
    - ["hour"]  # By hour
    - ["day_of_week"]  # By day of week
    - ["is_weekend"]  # Weekend vs weekday
    - ["start_location_id", "hour"]  # By location and hour
  backtesting:
    enabled: True
    expanding_window: True
    rolling_origin: True
    horizon: "7D"
    window_size: "30D"  # 30 days initial window
    step_size: "7D"  # Move forward 7 days at a time
    refit_frequency: "7D"  # Refit models every 7 days

# Surge Pricing Optimization
surge_pricing:
  enabled: True
  optimization_objective: "revenue_maximization" # Options: "revenue_maximization", "balance", "driver_utilization"
  min_surge_multiplier: 1.0
  max_surge_multiplier: 3.0
  surge_granularity: 0.1 # Increments for surge multiplier
  price_elasticity_method: "causal" # Options: "historical", "experimental", "causal"
  driver_response_model: True # Model how drivers respond to surge
  passenger_response_model: True # Model how passengers respond to surge
  multi_objective_weights:
    revenue: 0.7
    driver_utilization: 0.2
    passenger_satisfaction: 0.1
  simulation:
    num_iterations: 1000
    scenarios: ["normal", "high_demand", "low_supply", "special_event"]
    monte_carlo_samples: 100 # For uncertainty propagation
    confidence_level: 0.9 # For robust optimization
    regret_threshold: 0.01 # regret_threshold < ε 

# Visualizations and Reporting
visualization:
  interactive_dashboard: True
  heatmaps:
    enabled: True
    granularity: "hour" # Options: "hour", "day", "week"
  time_series_plots:
    enabled: True
    comparison_methods: ["actual", "baseline", "ensemble"]
    show_prediction_intervals: True
  feature_importance:
    enabled: True
    methods: ["shap", "permutation"]
    top_n_features: 20
  map_visualizations:
    enabled: True
    colormap: "viridis"
    animate_over_time: True
  pricing_optimization:
    enabled: True
    show_revenue_curves: True
    show_elasticity_curves: True

# Experiment Tracking
experiment_tracking:
  enabled: True
  platform: "mlflow" # Options: "mlflow", "wandb", "tensorboard"
  experiment_name: "ride_demand_forecasting"
  tags:
    project: "surge_pricing_optimization"
    department: "data_science"
    version: "1.0.0"
  track_metrics: True
  track_parameters: True
  track_artifacts: True
  track_code: True
